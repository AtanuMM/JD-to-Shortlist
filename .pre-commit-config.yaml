repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - fastapi>=0.115.0
        args: [--strict, -p, app, -p, tests]
